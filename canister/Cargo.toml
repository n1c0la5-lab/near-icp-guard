[package]
name = "guard"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
bs58 = "0.5"
candid = "0.10"
ed25519-dalek = { version = "2", default-features = false }
hex = "0.4"
ic-cdk = "0.20"
ic-cdk-management-canister = "0.3"
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
candid_parser = "0.2"
serde_json = "1"
