# icp-cli project file (icp >= 1.2). Recipe version is pinned on purpose:
# icp rejects unpinned recipes.
canisters:
  - name: guard
    recipe:
      type: "@dfinity/rust@v3.3.0"
      configuration:
        package: guard
        candid: canister/guard.did

# The local network listens on port 8010. 8000 is a common default and was
# taken on our dev machine; any free port works.
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010

# The attack demo (`agent/demo/`) runs against its own canister in its own
# environment and reinstalls it between runs. `guard` in the default local
# environment and its audit log are not touched.
environments:
  - name: demo
    network: local
    canisters:
      - guard
